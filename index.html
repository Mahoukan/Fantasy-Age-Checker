<!doctype html>
<html lang="en" data-theme="bureau-classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A humorous fantasy age compatibility checker comparing maturity, adult experience and lifespan across fantasy species."
    />
    <meta name="theme-color" content="#171a21" />
    <meta property="og:title" content="Fantasy Age Checker | Arcane Relationship Bureau" />
    <meta
      property="og:description"
      content="A humorous fantasy age compatibility checker comparing maturity, adult experience and lifespan across fantasy species."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fantasy Age Checker | Arcane Relationship Bureau" />
    <meta
      name="twitter:description"
      content="A humorous fantasy age compatibility checker comparing maturity, adult experience and lifespan across fantasy species."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const key = 'fantasy-age-checker-site-theme';
        const backgrounds = {
          'bureau-classic': '#171a21', 'royal-decree': '#28162e',
          'elven-archive': '#122820', 'dwarven-registry': '#1d1a18',
          'goblin-administration': '#222518', 'arcane-terminal': '#061218',
          'fae-court': '#25162d', 'dragon-archive': '#1b1210',
          'celestial-tribunal': '#10162f', 'obsidian-records': '#050607'
        };
        try {
          const saved = localStorage.getItem(key);
          if (saved && Object.prototype.hasOwnProperty.call(backgrounds, saved)) {
            document.documentElement.dataset.theme = saved;
            document.documentElement.style.backgroundColor = backgrounds[saved];
          }
        } catch { /* Bureau Classic remains the safe default. */ }
      })();
    </script>
    <title>Fantasy Age Checker | Arcane Relationship Bureau</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
